<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600&display=swap">
<style>
/* Big picture tiles on the same playground ground as the games; one tile per game folder */
:root{
  --ground:#EEF4FB; --card:#FFFFFF; --ink:#1C2647; --soft:#5A6485; --line:#D5DEEC; --accent:#2F5BEA; --accent-bg:#E3EAFE;
  --t1:#2F5BEA; --t1-bg:#E3EAFE;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#10162A; --card:#1A2240; --ink:#EEF2FF; --soft:#A9B2D3; --line:#2E3963; --accent:#8EA8FF; --accent-bg:#26326A;
  --t1:#8EA8FF; --t1-bg:#26326A; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#10162A; --card:#1A2240; --ink:#EEF2FF; --soft:#A9B2D3; --line:#2E3963; --accent:#8EA8FF; --accent-bg:#26326A;
  --t1:#8EA8FF; --t1-bg:#26326A; color-scheme:dark}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
img,svg,a{-webkit-user-drag:none}
html,body,*{touch-action:manipulation}
:focus:not(:focus-visible){outline:none}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(24px,env(safe-area-inset-top,0px)) max(32px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.1;margin:0;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;aspect-ratio:1;max-width:100%;
  background:var(--card);border:2px solid var(--line);border-radius:28px;text-decoration:none;color:var(--ink);padding:16px;touch-action:manipulation}
.tile:active{transform:scale(.97)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.icon{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.name{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Games</h1>
  <nav class="grid" aria-label="Games">
    <!-- To add a game: put it in its own folder with an index.html, then copy a tile below and change the link, colours and icon. -->
    <a class="tile" href="tricky-words/" aria-label="Tricky Words">
      <span class="icon" style="background:var(--t1-bg);color:var(--t1)">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </span>
      <span class="name">Tricky Words</span>
    </a>
    <a class="tile" href="maths/" aria-label="Maths">
      <span class="icon" style="background:var(--t1-bg);color:var(--t1)">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 7v8M2.5 11h8M14 8l6 6M20 8l-6 6"/></svg>
      </span>
      <span class="name">Maths</span>
    </a>
  </nav>
</div>
<script>
// No pinch or double-tap zoom (Safari ignores user-scalable=no, so block its gesture events too).
['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()},{passive:false})});
document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('dblclick',function(e){e.preventDefault()},{passive:false});
document.addEventListener('selectstart',function(e){e.preventDefault()});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('dragstart',function(e){e.preventDefault()});
document.addEventListener('pointerup',function(){var a=document.activeElement;if(a&&a!==document.body&&a.blur)setTimeout(function(){try{a.blur()}catch(e){}},0)});
</script>
</body>
</html>
