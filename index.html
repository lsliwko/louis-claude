<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Say It Pronouns</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600&display=swap">
<style>
/* One centred play card on a soft playground ground; word is the hero */
:root{
  --ground:#EEF4FB; --card:#FFFFFF; --ink:#1C2647; --soft:#5A6485; --line:#D5DEEC;
  --accent:#2F5BEA; --accent-bg:#E3EAFE; --good:#1F7A4D; --good-bg:#DFF3E8; --bad:#B4322A; --bad-bg:#FBE3E0; --star:#E3A21A;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#10162A; --card:#1A2240; --ink:#EEF2FF; --soft:#A9B2D3; --line:#2E3963;
  --accent:#8EA8FF; --accent-bg:#26326A; --good:#7FD8A8; --good-bg:#173D2B; --bad:#FF9C92; --bad-bg:#4A1F1C; --star:#F4C04E; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#10162A; --card:#1A2240; --ink:#EEF2FF; --soft:#A9B2D3; --line:#2E3963;
  --accent:#8EA8FF; --accent-bg:#26326A; --good:#7FD8A8; --good-bg:#173D2B; --bad:#FF9C92; --bad-bg:#4A1F1C; --star:#F4C04E; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--soft);font-variant-numeric:tabular-nums}
.stars{color:var(--star);font-family:var(--display);font-size:22px;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.word{font-family:var(--display);font-weight:700;font-size:clamp(72px,24vw,112px);line-height:1;color:var(--accent);margin:4px 0 0}
.ex{color:var(--soft);font-size:18px;margin:0}
button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 18px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:active{transform:scale(.97)}
.hear{font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:8px}
.mic{width:100%;min-height:68px;font-family:var(--display);font-weight:700;font-size:22px;background:var(--accent);color:var(--card);border-color:var(--accent);display:flex;align-items:center;justify-content:center;gap:10px}
.mic.live{background:var(--bad);border-color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.fb{min-height:32px;text-align:center;font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}.fb.info{color:var(--soft);font-family:var(--body);font-weight:600;font-size:16px}
.label{text-align:center;font-size:14px;color:var(--soft);margin:0}
.marks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.marks button{min-height:60px;font-weight:600;font-size:17px}
.yes{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.no{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.end-stars{font-size:56px;color:var(--star);letter-spacing:6px;line-height:1}
.end-stars span.off{color:var(--line)}
.end h2{font-family:var(--display);font-size:30px;margin:0;text-wrap:balance}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top"><span id="prog">Word 1 of 8</span><span class="stars">★ <span id="score">0</span></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="card" id="card">
    <p class="word" id="word">he</p>
    <button class="hear" id="hear" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>Hear it</button>
  </div>
  <div id="ctrl" style="display:flex;flex-direction:column;gap:12px">
    <button class="mic" id="mic" type="button"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="micl">Tap and say the word</span></button>
    <p class="fb" id="fb" aria-live="polite"></p>
    <p class="label">Grown-up: mark it yourself</p>
    <div class="marks">
      <button class="yes" id="yes" type="button">✓ Said it right</button>
      <button class="no" id="no" type="button">↻ Try again</button>
    </div>
  </div>
</div>
<script>
var W=[
{w:"I",s:["i","eye","aye","ay"]},
{w:"be",s:["be","bee","b"]},
{w:"me",s:["me","mi"]},
{w:"we",s:["we","wee","wii"]},
{w:"to",s:["to","too","two","2"]},
{w:"he",s:["he","hee"]},
{w:"she",s:["she","shee"]},
{w:"was",s:["was","woz","wuz"]}
];
function $(id){return document.getElementById(id)}
var AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
document.addEventListener('pointerdown',ac);
function noiseBuf(c,sec){var b=c.createBuffer(1,Math.floor(c.sampleRate*sec),c.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function cheer(){var c=ac();if(!c)return;var t=c.currentTime+0.05,out=c.createGain();out.gain.value=0.9;out.connect(c.destination);
  [523.25,659.25,783.99,1046.5].forEach(function(f,i){var o=c.createOscillator(),g=c.createGain(),st=t+i*0.12,len=i===3?0.6:0.16;
    o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.28,st+0.02);g.gain.exponentialRampToValueAtTime(0.001,st+len);
    o.connect(g);g.connect(out);o.start(st);o.stop(st+len+0.05)});
  var crowd=c.createBufferSource();crowd.buffer=noiseBuf(c,2.2);
  var bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1100;bp.Q.value=0.7;
  var cg=c.createGain();cg.gain.setValueAtTime(0,t);cg.gain.linearRampToValueAtTime(0.22,t+0.35);cg.gain.setValueAtTime(0.22,t+1.3);cg.gain.linearRampToValueAtTime(0,t+2.1);
  crowd.connect(bp);bp.connect(cg);cg.connect(out);crowd.start(t);crowd.stop(t+2.2);
  var clapBuf=noiseBuf(c,0.08);
  for(var k=0;k<22;k++){var ct=t+0.1+Math.random()*1.6,cs=c.createBufferSource(),hp=c.createBiquadFilter(),g2=c.createGain();
    cs.buffer=clapBuf;hp.type='highpass';hp.frequency.value=900+Math.random()*800;
    g2.gain.setValueAtTime(0.35,ct);g2.gain.exponentialRampToValueAtTime(0.001,ct+0.07);
    cs.connect(hp);hp.connect(g2);g2.connect(out);cs.start(ct);cs.stop(ct+0.08)}
}
var fx=document.getElementById('fx'),fctx=fx.getContext('2d'),parts=[],running=false,
  COLS=['#FF5A5F','#FFC145','#3DDC97','#4CC9F0','#B388FF','#FF8FD8','#FFFFFF'];
function sizeFx(){var r=window.devicePixelRatio||1;fx.width=innerWidth*r;fx.height=innerHeight*r;fctx.setTransform(r,0,0,r,0,0)}
function burst(x,y){var col=COLS[Math.floor(Math.random()*COLS.length)],col2=COLS[Math.floor(Math.random()*COLS.length)];
  for(var i=0;i<60;i++){var a=Math.random()*Math.PI*2,v=1.5+Math.random()*4.5;
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:55+Math.random()*35,c:i%3?col:col2,r:2+Math.random()*2})}}
function fireworks(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  sizeFx();var w=innerWidth,h=innerHeight;
  [0,280,560,840].forEach(function(d){setTimeout(function(){burst(w*(0.2+Math.random()*0.6),h*(0.15+Math.random()*0.35))},d)});
  if(!running){running=true;requestAnimationFrame(tick)}}
function tick(){fctx.clearRect(0,0,fx.width,fx.height);
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.life++;p.vx*=0.98;p.vy=p.vy*0.98+0.06;p.x+=p.vx;p.y+=p.vy;
    if(p.life>p.max){parts.splice(i,1);continue}
    fctx.globalAlpha=1-p.life/p.max;fctx.fillStyle=p.c;fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,Math.PI*2);fctx.fill()}
  fctx.globalAlpha=1;
  if(parts.length)requestAnimationFrame(tick);else{running=false;fctx.clearRect(0,0,fx.width,fx.height)}}

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var order=shuf(W),n=0,score=0,tries=0,busy=false,rec=null,SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=0.8;speechSynthesis.speak(u)}catch(e){}}
function fb(t,k){var f=$('fb');f.textContent=t;f.className='fb'+(k?' '+k:'')}
function show(){var x=order[n];tries=0;busy=false;
  $('prog').textContent='Word '+(n+1)+' of '+order.length;$('bar').style.width=(n/order.length*100)+'%';
  $('word').textContent=x.w;fb('')}
function right(){if(busy)return;busy=true;if(tries===0){score++;$('score').textContent=score}
  var c=['Well done!','Brilliant!','Super!','Great job!','Perfect!'];fb(c[Math.floor(Math.random()*c.length)],'ok');
  try{speechSynthesis.cancel()}catch(e){}cheer();fireworks();setTimeout(function(){n++;n<order.length?show():end()},2600)}
function wrong(m){tries++;fb(m||'Please try again','no');setTimeout(function(){say('Please try again')},250)}
$('hear').onclick=function(){say(order[n].w)};
$('yes').onclick=right;$('no').onclick=function(){if(!busy)wrong()};
function norm(t){return t.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim()}
function stopUI(){$('mic').classList.remove('live');$('micl').textContent='Tap and say the word'}
var NOMIC="The microphone isn't available here. Use the buttons below.";
$('mic').onclick=function(){
  ac();if(busy)return;
  if(!SR){fb(NOMIC,'info');return}
  if(rec){try{rec.abort()}catch(e){}rec=null;stopUI();return}
  try{rec=new SR();rec.lang='en-GB';rec.maxAlternatives=5;rec.interimResults=false;rec.continuous=false}catch(e){fb(NOMIC,'info');return}
  var x=order[n],got=false;
  rec.onresult=function(ev){got=true;var heard=[],ok=false;
    for(var i=0;i<ev.results[0].length;i++){var t=norm(ev.results[0][i].transcript);heard.push(t);
      var ws=t.split(/\s+/);if(x.s.indexOf(t)>=0||(ws.length<=2&&ws.some(function(w){return x.s.indexOf(w)>=0})))ok=true}
    ok?right():wrong('I heard "'+(heard[0]||'?')+'". Please try again')};
  rec.onerror=function(ev){got=true;stopUI();
    if(ev.error==='not-allowed'||ev.error==='service-not-allowed')fb("The microphone isn't allowed here. Use the buttons below.",'info');
    else if(ev.error==='no-speech')fb("I didn't hear anything. Try again!",'info');
    else fb("Couldn't listen just now. Try again or use the buttons.",'info')};
  rec.onend=function(){stopUI();rec=null;if(!got)fb("I didn't hear anything. Try again!",'info')};
  try{speechSynthesis.cancel()}catch(e){}
  try{rec.start();$('mic').classList.add('live');$('micl').textContent='Listening…';fb('')}catch(e){stopUI();fb(NOMIC,'info')}
};
function end(){$('bar').style.width='100%';$('prog').textContent='All done';
  var L=order.length,st=score>=L-1?3:score>=Math.ceil(L*0.6)?2:1,s='';for(var i=0;i<3;i++)s+=i<st?'<span>★</span>':'<span class="off">★</span>';
  $('card').className='card end';
  $('card').innerHTML='<div class="end-stars">'+s+'</div><h2>'+score+' of '+order.length+' first time!</h2><p class="ex">'+(st===3?'Amazing talking.':'Good try. Play again for more stars.')+'</p><button id="again" type="button" class="mic" style="margin-top:8px">Play again</button>';
  $('ctrl').innerHTML='';
  $('again').onclick=function(){order=shuf(W);n=0;score=0;$('score').textContent=0;location.reload()};
  say('All done! Well done!')}
show();
</script>
</body>
</html>
