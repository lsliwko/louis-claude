<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Math</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600&display=swap">
<style>
/* Same play card as Tricky Words; the sum is the hero, three big answer buttons below */
:root{
  --ground:#EEF4FB; --card:#FFFFFF; --ink:#1C2647; --soft:#5A6485; --line:#D5DEEC;
  --accent:#2F5BEA; --accent-bg:#E3EAFE; --good:#1F7A4D; --good-bg:#DFF3E8; --bad:#B4322A; --bad-bg:#FBE3E0; --star:#E3A21A; --btn:#2F5BEA; --btn-ok:#1F7A4D; --btn-no:#8A93AE; --on-btn:#FFFFFF;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#10162A; --card:#1A2240; --ink:#EEF2FF; --soft:#A9B2D3; --line:#2E3963;
  --accent:#8EA8FF; --accent-bg:#26326A; --good:#7FD8A8; --good-bg:#173D2B; --bad:#FF9C92; --bad-bg:#4A1F1C; --star:#F4C04E; --btn:#3D63E0; --btn-ok:#23885A; --btn-no:#4A5372; --on-btn:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#10162A; --card:#1A2240; --ink:#EEF2FF; --soft:#A9B2D3; --line:#2E3963;
  --accent:#8EA8FF; --accent-bg:#26326A; --good:#7FD8A8; --good-bg:#173D2B; --bad:#FF9C92; --bad-bg:#4A1F1C; --star:#F4C04E; --btn:#3D63E0; --btn-ok:#23885A; --btn-no:#4A5372; --on-btn:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
img,svg,a{-webkit-user-drag:none}
button,a{touch-action:manipulation}
:focus:not(:focus-visible){outline:none}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--soft);font-variant-numeric:tabular-nums}
.home{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);background:var(--card);border:2px solid var(--line)}
.home:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stars{display:flex;gap:3px}
.st{display:block;width:28px;height:28px}
.st path{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}
.st.ok path{fill:var(--star);stroke:var(--star)}
.st.miss path{fill:var(--soft);stroke:var(--soft)}
.st.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.5)}}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.word{font-family:var(--display);font-weight:700;font-size:clamp(72px,24vw,112px);line-height:1;color:var(--accent);margin:4px 0 0}
.ex{color:var(--soft);font-size:18px;margin:0}
button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 18px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:active{transform:scale(.97)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@keyframes pulse{50%{transform:scale(1.03)}}
.q{font-family:var(--display);font-weight:700;font-size:clamp(48px,14vw,96px);line-height:1;color:var(--accent);margin:4px 0 0;white-space:nowrap;font-variant-numeric:tabular-nums}
.q .ans{color:var(--good)}
.opts{display:flex;flex-direction:row;gap:12px}
.opt{flex:1 1 0;min-width:0;min-height:104px;padding:0;font-family:var(--display);font-weight:700;font-size:44px;line-height:1;color:var(--on-btn);background:var(--btn);border-color:var(--btn);font-variant-numeric:tabular-nums}
.opt.ok{background:var(--btn-ok);border-color:var(--btn-ok);color:var(--on-btn)}
.opt.no{background:var(--btn-no);border-color:var(--btn-no);color:var(--on-btn);opacity:.6}
.opt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.again{width:100%;min-height:96px;margin-top:8px;background:var(--accent);color:var(--card);border-color:var(--accent);display:flex;align-items:center;justify-content:center}
.fb{min-height:32px;text-align:center;font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}.fb.info{color:var(--soft);font-family:var(--body);font-weight:600;font-size:16px}
.end-stars{font-size:48px;color:var(--star);letter-spacing:4px;line-height:1}
.end-stars span.off{color:var(--soft)}
.end h2{font-family:var(--display);font-size:30px;margin:0;text-wrap:balance}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top"><a class="home" href="../" aria-label="Back to all games"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a><span id="prog" style="flex:1;margin-left:12px">Question 1 of 5</span><span class="stars" id="stars" aria-label="Stars"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="card" id="card">
    <p class="q" id="q">3 × 4 =</p>
  </div>
  <div class="card end" id="endcard" hidden></div>
  <div id="ctrl" style="display:flex;flex-direction:column;gap:12px">
    <div class="opts" id="opts"><button class="opt" type="button">12</button><button class="opt" type="button">10</button><button class="opt" type="button">15</button></div>
    <p class="fb" id="fb" aria-live="polite"></p>
  </div>
</div>
<script>
function $(id){return document.getElementById(id)}
var AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
function noiseBuf(c,sec){var b=c.createBuffer(1,Math.floor(c.sampleRate*sec),c.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function cheer(){var c=ac();if(!c)return;var t=c.currentTime+0.05,out=c.createGain();out.gain.value=0.9;out.connect(c.destination);
  [523.25,659.25,783.99,1046.5].forEach(function(f,i){var o=c.createOscillator(),g=c.createGain(),st=t+i*0.12,len=i===3?0.6:0.16;
    o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.28,st+0.02);g.gain.exponentialRampToValueAtTime(0.001,st+len);
    o.connect(g);g.connect(out);o.start(st);o.stop(st+len+0.05)});
  var crowd=c.createBufferSource();crowd.buffer=noiseBuf(c,2.2);
  var bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1100;bp.Q.value=0.7;
  var cg=c.createGain();cg.gain.setValueAtTime(0,t);cg.gain.linearRampToValueAtTime(0.22,t+0.35);cg.gain.setValueAtTime(0.22,t+1.3);cg.gain.linearRampToValueAtTime(0,t+2.1);
  crowd.connect(bp);bp.connect(cg);cg.connect(out);crowd.start(t);crowd.stop(t+2.2);
  var clapBuf=noiseBuf(c,0.08);
  for(var k=0;k<22;k++){var ct=t+0.1+Math.random()*1.6,cs=c.createBufferSource(),hp=c.createBiquadFilter(),g2=c.createGain();
    cs.buffer=clapBuf;hp.type='highpass';hp.frequency.value=900+Math.random()*800;
    g2.gain.setValueAtTime(0.35,ct);g2.gain.exponentialRampToValueAtTime(0.001,ct+0.07);
    cs.connect(hp);hp.connect(g2);g2.connect(out);cs.start(ct);cs.stop(ct+0.08)}
}
function buzz(){var c=ac();if(!c)return;var t=c.currentTime+0.03,lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;lp.connect(c.destination);
  [[311,0,0.25],[262,0.28,0.5]].forEach(function(p,i){var o=c.createOscillator(),g=c.createGain(),st=t+p[1],len=p[2];
    o.type='sawtooth';o.frequency.setValueAtTime(p[0],st);if(i)o.frequency.linearRampToValueAtTime(p[0]*0.85,st+len);
    g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.18,st+0.02);g.gain.setValueAtTime(0.18,st+len-0.08);g.gain.linearRampToValueAtTime(0,st+len);
    o.connect(g);g.connect(lp);o.start(st);o.stop(st+len+0.05)})}
var fx=document.getElementById('fx'),fctx=fx.getContext('2d'),parts=[],flashes=[],running=false,
  COLS=['#FF5A5F','#FFC145','#3DDC97','#4CC9F0','#B388FF','#FF8FD8','#FF9F43','#FFFFFF'];
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function sizeFx(){var r=window.devicePixelRatio||1;fx.width=innerWidth*r;fx.height=innerHeight*r;fctx.setTransform(r,0,0,r,0,0)}
function boom(){var c=AC;if(!c)return;try{var t=c.currentTime,src=c.createBufferSource(),lp=c.createBiquadFilter(),g=c.createGain();
  src.buffer=noiseBuf(c,0.6);lp.type='lowpass';lp.frequency.value=500;g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.55);
  src.connect(lp);lp.connect(g);g.connect(c.destination);src.start(t);src.stop(t+0.6)}catch(e){}}
function spark(x,y,vx,vy,col,o){parts.push({x:x,y:y,px:x,py:y,vx:vx,vy:vy,c:col,life:0,max:o.max||70,r:o.r||2.2,drag:o.drag||0.975,grav:o.grav||0.05,tw:o.tw||false,crackle:o.crackle||false,kind:o.kind||'spark'})}
function explode(p){boom();flashes.push({x:p.x,y:p.y,life:0});
  var type=p.type,c1=p.c,c2=pick(COLS),i,a,v;
  if(type==='ring'){for(i=0;i<56;i++){a=i/56*Math.PI*2;v=4.2;spark(p.x,p.y,Math.cos(a)*v,Math.sin(a)*v,i%2?c1:c2,{max:70})}
    for(i=0;i<28;i++){a=i/28*Math.PI*2;v=2.2;spark(p.x,p.y,Math.cos(a)*v,Math.sin(a)*v,'#FFFFFF',{max:55,r:1.8})}}
  else if(type==='willow'){for(i=0;i<90;i++){a=Math.random()*Math.PI*2;v=1+Math.random()*3.6;spark(p.x,p.y,Math.cos(a)*v,Math.sin(a)*v,'#FFC145',{max:90,drag:0.98,grav:0.04,r:1.8,tw:true})}}
  else if(type==='heart'){for(i=0;i<70;i++){var tt=i/70*Math.PI*2,hx=16*Math.pow(Math.sin(tt),3),hy=-(13*Math.cos(tt)-5*Math.cos(2*tt)-2*Math.cos(3*tt)-Math.cos(4*tt));
    spark(p.x,p.y,hx*0.26,hy*0.26,'#FF5A9E',{max:65,drag:0.97,grav:0.025,r:2.4})}}
  else if(type==='crackle'){for(i=0;i<50;i++){a=Math.random()*Math.PI*2;v=2+Math.random()*3.5;spark(p.x,p.y,Math.cos(a)*v,Math.sin(a)*v,c1,{max:45+Math.random()*20,crackle:true})}}
  else{for(i=0;i<100;i++){a=Math.random()*Math.PI*2;v=1.5+Math.random()*4.8;spark(p.x,p.y,Math.cos(a)*v,Math.sin(a)*v,i%3?c1:c2,{max:50+Math.random()*25,tw:i%4===0})}}}
function rocket(type){var w=innerWidth,h=innerHeight,x=w*(0.15+Math.random()*0.7),ty=h*(0.12+Math.random()*0.3);
  var vy=-Math.sqrt(2*0.25*(h-ty))*0.98;parts.push({kind:'rocket',x:x,y:h+10,px:x,py:h+10,vx:(Math.random()-0.5)*1.2,vy:vy,c:pick(COLS),type:type,life:0,max:999});loop()}
var fwTimers=[];
function fwLater(fn,ms){var id=setTimeout(function(){fwTimers=fwTimers.filter(function(x){return x!==id});fn()},ms);fwTimers.push(id)}
function afterFx(cb){var t0=Date.now();(function chk(){var on=parts.length||flashes.length||fwTimers.length,el=Date.now()-t0;
  if((!on&&el>1500)||el>6000)cb();else setTimeout(chk,150)})()}
function clearFx(){fwTimers.forEach(clearTimeout);fwTimers=[];parts.length=0;flashes.length=0;fctx.clearRect(0,0,innerWidth,innerHeight)}
document.addEventListener('pointerdown',function(e){if(e.target&&e.target.closest&&e.target.closest('button,a'))clearFx()},true);
function loop(){if(!running){running=true;requestAnimationFrame(tick)}}
function fireworks(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  sizeFx();var seq=['sphere','ring','heart','willow','crackle','sphere','ring'];
  seq.forEach(function(t,i){fwLater(function(){rocket(t)},i*250)});
}
function tick(){fctx.clearRect(0,0,innerWidth,innerHeight);fctx.lineCap='round';
  for(var f=flashes.length-1;f>=0;f--){var fl=flashes[f];fl.life++;if(fl.life>10){flashes.splice(f,1);continue}
    fctx.globalAlpha=(1-fl.life/10)*0.5;fctx.fillStyle='#FFF6D6';fctx.beginPath();fctx.arc(fl.x,fl.y,18+fl.life*5,0,Math.PI*2);fctx.fill()}
  var add=[];
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.px=p.x;p.py=p.y;p.life++;
    if(p.kind==='rocket'){p.vy+=0.25;p.x+=p.vx;p.y+=p.vy;
      if(Math.random()<0.7)add.push([p.x,p.y,(Math.random()-0.5)*0.6,Math.random()*0.8,'#FFE3A3',{max:18,r:1.4,grav:0.02}]);
      if(p.vy>=-0.6){parts.splice(i,1);explode(p);continue}
      fctx.globalAlpha=1;fctx.strokeStyle=p.c;fctx.lineWidth=3;fctx.beginPath();fctx.moveTo(p.px,p.py+6);fctx.lineTo(p.x,p.y);fctx.stroke();continue}
    p.vx*=p.drag;p.vy=p.vy*p.drag+p.grav;p.x+=p.vx;p.y+=p.vy;
    if(p.life>p.max){if(p.crackle)for(var k=0;k<4;k++){var a=Math.random()*Math.PI*2;add.push([p.x,p.y,Math.cos(a)*1.4,Math.sin(a)*1.4,'#FFFFFF',{max:14,r:1.3,grav:0.03}])}
      parts.splice(i,1);continue}
    var al=1-p.life/p.max;if(p.tw&&Math.random()<0.35)al*=0.2;
    fctx.globalAlpha=al;fctx.strokeStyle=p.c;fctx.lineWidth=p.r*1.6;fctx.beginPath();fctx.moveTo(p.px-p.vx*2,p.py-p.vy*2);fctx.lineTo(p.x,p.y);fctx.stroke()}
  add.forEach(function(a){spark(a[0],a[1],a[2],a[3],a[4],a[5])});
  fctx.globalAlpha=1;
  if(parts.length||flashes.length)requestAnimationFrame(tick);else{running=false;fctx.clearRect(0,0,innerWidth,innerHeight)}}

var VOICE=null,UTT=null;
function pickVoice(){try{var vs=(speechSynthesis.getVoices()||[]).filter(function(v){return /^en[-_]GB/i.test(v.lang)});
  var rank=function(v){var nm=v.name||'';return (/premium|enhanced|neural|natural/i.test(nm)?0:1)+(/daniel|kate|serena|arthur|martha|stephanie|google uk/i.test(nm)?0:1)};
  vs.sort(function(a,b){return rank(a)-rank(b)});VOICE=vs[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){try{var ss=window.speechSynthesis;if(!ss)return;
  if(!VOICE)pickVoice();
  var go=function(){try{UTT=new SpeechSynthesisUtterance(t);if(VOICE)UTT.voice=VOICE;UTT.lang='en-GB';UTT.rate=0.8;UTT.volume=1;ss.resume();ss.speak(UTT)}catch(e){}};
  if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,120)}else go()}catch(e){}}
function fb(t,k){var f=$('fb');f.textContent=t;f.className='fb'+(k?' '+k:'')}
var STAR='<path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/>',res=[];
function drawStars(){var h='';for(var i=0;i<res.length;i++)h+='<svg class="st'+(res[i]?' '+res[i]:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+STAR+'</svg>';$('stars').innerHTML=h;
  $('stars').setAttribute('aria-label',score+' stars')}
function mark(ok){res[n]=ok?'ok':'miss';drawStars();var el=$('stars').children[n];if(el)el.classList.add('pop')}

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
// Questions: times a x b with a and b from 1 to 10, adding a + b with a and b from 0 to 40.
// Each question in a round is a times or an adding question with equal chance.
var TIMES_MIN=1,TIMES_MAX=10,ADD_MIN=0,ADD_MAX=40,QX=[],QA=[];
for(var a=TIMES_MIN;a<=TIMES_MAX;a++)for(var b=TIMES_MIN;b<=TIMES_MAX;b++)QX.push({op:'x',a:a,b:b,k:a+'x'+b});
for(var a=ADD_MIN;a<=ADD_MAX;a++)for(var b=ADD_MIN;b<=ADD_MAX;b++)QA.push({op:'+',a:a,b:b,k:a+'+'+b});
function ans(x){return x.op==='+'?x.a+x.b:x.a*x.b}
function sign(x){return x.op==='+'?'+':'\u00d7'}
// Wrong answers allowed before the right one is shown (3 buttons, so 2 wrong leaves only the right one).
var TRIES=2;
var MKEY='mx-misses',MISS={};try{MISS=JSON.parse(localStorage.getItem(MKEY)||'{}')||{}}catch(e){MISS={}}
function saveMiss(){try{localStorage.setItem(MKEY,JSON.stringify(MISS))}catch(e){}}
function noteMiss(k){MISS[k]=Math.min((MISS[k]||0)+1,5);saveMiss()}
function noteHit(k){if(MISS[k]){MISS[k]--;if(!MISS[k])delete MISS[k];saveMiss()}}
function pickFrom(pool){var tot=0,ws=pool.map(function(v){var x=1+2*(MISS[v.k]||0);tot+=x;return x}),r=Math.random()*tot,i=0;
  while(r>=ws[i]){r-=ws[i];i++}return pool.splice(i,1)[0]}
function pickRound(k){var px=QX.slice(),pa=QA.slice(),out=[];
  while(out.length<k)out.push(pickFrom(Math.random()<0.5?px:pa));return out}
// Two believable wrong answers. Times: a neighbouring times-table answer, or the answer plus or minus a little.
// Adding: the answer plus or minus 1 to 3, or 10 out (a common tens slip). Adding answers can be 0; times answers start at 1.
function options(x){var c=ans(x),lo=x.op==='+'?0:1,cand=x.op==='+'?[c+1,c-1,c+2,c-2,c+1,c-1,c+3,c-3,c+10,c-10]:[x.a*(x.b+1),x.a*(x.b-1),(x.a+1)*x.b,(x.a-1)*x.b,c+1,c-1,c+2,c-2,c+10,c-10,x.a+x.b],seen={},out=[];seen[c]=1;
  shuf(cand).forEach(function(v){if(out.length<2&&v>=lo&&!seen[v]){seen[v]=1;out.push(v)}});
  for(var d=3;out.length<2;d++){[c+d,c-d].forEach(function(v){if(out.length<2&&v>=lo&&!seen[v]){seen[v]=1;out.push(v)}})}
  return shuf([c].concat(out))}
var ROUND=5,order=pickRound(ROUND),n=0,score=0,tries=0,busy=false;
function spoken(x){return x.a+(x.op==='+'?' plus ':' times ')+x.b}
function show(){var x=order[n];tries=0;busy=false;
  $('prog').textContent='Question '+(n+1)+' of '+order.length;$('bar').style.width=(n/order.length*100)+'%';
  $('q').textContent=x.a+' '+sign(x)+' '+x.b+' =';fitQ();fb('');
  var box=$('opts');box.innerHTML='';
  options(x).forEach(function(v){var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=v;b.setAttribute('aria-label',String(v));
    b.onclick=function(){answer(b,v)};box.appendChild(b)})}
function fitQ(){var q=$('q'),max=$('card').clientWidth-40;q.style.fontSize='';var fs=parseFloat(getComputedStyle(q).fontSize);
  while(q.scrollWidth>max&&fs>24){fs-=2;q.style.fontSize=fs+'px'}}
window.addEventListener('resize',fitQ);
function reveal(x){$('q').innerHTML=x.a+' '+sign(x)+' '+x.b+' = <span class="ans">'+ans(x)+'</span>';fitQ();
  Array.prototype.forEach.call($('opts').children,function(b){if(+b.textContent===ans(x))b.classList.add('ok');b.disabled=true})}
function answer(b,v){if(busy||b.disabled)return;ac();var x=order[n];
  if(v===ans(x))return right(b);
  b.classList.add('no','shake');b.disabled=true;wrong()}
function right(b){if(busy)return;busy=true;var x=order[n];score++;mark(true);if(tries===0)noteHit(x.k);reveal(x);
  var c=['Well done!','Brilliant!','Super!','Great job!','Perfect!'];fb(c[Math.floor(Math.random()*c.length)],'ok');
  try{speechSynthesis.cancel()}catch(e){}cheer();fireworks();afterFx(function(){n++;n<order.length?show():end()})}
function wrong(){if(busy)return;var x=order[n];tries++;buzz();if(tries===1)noteMiss(x.k);
  if(tries>=TRIES){busy=true;mark(false);reveal(x);var line=spoken(x)+' is '+ans(x);fb(x.a+' '+sign(x)+' '+x.b+' = '+ans(x),'info');
    setTimeout(function(){say(line)},850);setTimeout(function(){n++;n<order.length?show():end()},3800);return}
  fb('Please try again','no');setTimeout(function(){say('Please try again')},850)}
function lock(id){var b=$(id);if(!b||b.disabled)return false;b.disabled=true;setTimeout(function(){b.disabled=false},500);return true}
function end(){$('bar').style.width='100%';$('prog').textContent='All done';
  var L=order.length,st=score,s='';for(var i=0;i<L;i++)s+=res[i]==='ok'?'<span>★</span>':'<span class="off">★</span>';
  var ec=$('endcard');ec.innerHTML='<div class="end-stars">'+s+'</div><h2>'+score+' of '+order.length+' right!</h2><p class="ex">'+(st===L?'FIVE stars! You are winning!':'Good try. Play again for more stars.')+'</p><button id="again" type="button" class="again" aria-label="Play again"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11A8 8 0 1 0 18 17"/><path d="M20 5v6h-6"/></svg></button>';
  $('card').hidden=true;$('ctrl').hidden=true;ec.hidden=false;
  $('again').onclick=function(){if(!lock('again'))return;restart()};
  say(st===L?'Five stars! You are winning!':'All done! Well done!')}
function restart(){try{speechSynthesis.cancel()}catch(e){}
  order=pickRound(ROUND);n=0;score=0;res=[];tries=0;busy=false;drawStars();
  $('endcard').hidden=true;$('endcard').innerHTML='';$('card').hidden=false;$('ctrl').hidden=false;show()}
window.addEventListener('pagehide',function(){try{speechSynthesis.cancel()}catch(e){}try{if(AC)AC.close()}catch(e){}});
drawStars();show();
</script>
<script>
document.addEventListener('selectstart',function(e){e.preventDefault()});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('dragstart',function(e){e.preventDefault()});
document.addEventListener('pointerup',function(){var a=document.activeElement;if(a&&a!==document.body&&a.blur)setTimeout(function(){try{a.blur()}catch(e){}},0)});
</script>
