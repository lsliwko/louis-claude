<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Reading</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600&display=swap">
<style>
/* Same play card as Tricky Words; the sum is the hero, three big answer buttons below */
:root{
  --ground:#EEF4FB; --card:#FFFFFF; --ink:#1C2647; --soft:#5A6485; --line:#D5DEEC;
  --accent:#2F5BEA; --accent-bg:#E3EAFE; --good:#1F7A4D; --good-bg:#DFF3E8; --bad:#B4322A; --bad-bg:#FBE3E0; --star:#E3A21A; --btn:#2F5BEA; --btn-ok:#1F7A4D; --btn-no:#8A93AE; --on-btn:#FFFFFF;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#10162A; --card:#1A2240; --ink:#EEF2FF; --soft:#A9B2D3; --line:#2E3963;
  --accent:#8EA8FF; --accent-bg:#26326A; --good:#7FD8A8; --good-bg:#173D2B; --bad:#FF9C92; --bad-bg:#4A1F1C; --star:#F4C04E; --btn:#3D63E0; --btn-ok:#23885A; --btn-no:#4A5372; --on-btn:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#10162A; --card:#1A2240; --ink:#EEF2FF; --soft:#A9B2D3; --line:#2E3963;
  --accent:#8EA8FF; --accent-bg:#26326A; --good:#7FD8A8; --good-bg:#173D2B; --bad:#FF9C92; --bad-bg:#4A1F1C; --star:#F4C04E; --btn:#3D63E0; --btn-ok:#23885A; --btn-no:#4A5372; --on-btn:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
img,svg,a{-webkit-user-drag:none}
html,body,*{touch-action:manipulation}
:focus:not(:focus-visible){outline:none}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--soft);font-variant-numeric:tabular-nums}
.home{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);background:var(--card);border:2px solid var(--line)}
.home:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stars{display:flex;gap:3px}
.st{display:block;width:28px;height:28px}
.st path{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}
.st.ok path{fill:var(--star);stroke:var(--star)}
.st.miss path{fill:var(--soft);stroke:var(--soft)}
.st.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.5)}}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.word{font-family:var(--display);font-weight:700;font-size:clamp(72px,24vw,112px);line-height:1;color:var(--accent);margin:4px 0 0}
.ex{color:var(--soft);font-size:18px;margin:0}
button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 18px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:active{transform:scale(.97)}
.hear{width:72px;height:72px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);background:var(--accent-bg);border-color:var(--accent)}
.hear.tap{animation:pulse .5s 2}
.hear:disabled{opacity:.3;cursor:default}
/* Until the ▶ start button is tapped, the other buttons (except home) are faded and can't be pressed */
.waiting .opt,.waiting .hear,.waiting .tool{opacity:.35;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@keyframes pulse{50%{transform:scale(1.03)}}
.pic{font-size:clamp(100px,min(50vw,calc(100vh - 535px)),240px);line-height:1.1;margin:0;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.card{position:relative}
#card{padding:16px 16px 18px;gap:6px}
/* Start button over the card: on iPhone sound and speech only turn on after a real tap */
.go{position:absolute;inset:0;margin:0;padding:0;border:none;border-radius:24px;background:color-mix(in srgb,var(--card) 70%,transparent);display:flex;align-items:center;justify-content:center;cursor:pointer}
.go[hidden]{display:none}
.go span{width:120px;height:120px;border-radius:50%;background:var(--btn);color:var(--on-btn);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(47,91,234,.35);animation:gopulse 1.6s ease-in-out infinite}
@keyframes gopulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){.go span{animation:none}}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{min-width:0;min-height:96px;padding:0;font-family:var(--display);font-weight:700;font-size:40px;line-height:1;color:var(--on-btn);background:var(--btn);border-color:var(--btn)}
.opt.ok{background:var(--btn-ok);border-color:var(--btn-ok);color:var(--on-btn)}
.opt.no{background:var(--btn-no);border-color:var(--btn-no);color:var(--on-btn);opacity:.6}
.opt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.again{width:100%;min-height:96px;margin-top:8px;background:var(--accent);color:var(--card);border-color:var(--accent);display:flex;align-items:center;justify-content:center}
.fb{min-height:32px;text-align:center;font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}.fb.info{color:var(--soft);font-family:var(--body);font-weight:600;font-size:16px}
.end-stars{font-size:48px;color:var(--star);letter-spacing:4px;line-height:1}
.end-stars span.off{color:var(--soft)}
.lvl{color:var(--soft);font-size:14px;margin:0}
.end h2{font-family:var(--display);font-size:30px;margin:0;text-wrap:balance}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top"><a class="home" href="../" aria-label="Back to all games"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a><span id="prog" style="flex:1;margin-left:12px">Question 1 of 5</span><span class="stars" id="stars" aria-label="Stars"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="card" id="card">
    <p class="pic" id="q" aria-hidden="true">🐱</p>
    <button class="hear" id="hear" type="button" aria-label="Hear the word"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
    <button class="go" id="go" type="button" aria-label="Start"><span><svg width="60" height="60" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.5 5.5v13l10-6.5z"/></svg></span></button>
  </div>
  <div class="card end" id="endcard" hidden></div>
  <div id="ctrl" style="display:flex;flex-direction:column;gap:12px">
    <div class="opts" id="opts"></div>
    <p class="fb" id="fb" aria-live="polite"></p>
  </div>
</div>
<script>
function $(id){return document.getElementById(id)}
var AC=null;
// Sound on iPhone: this game has no microphone, so Web Audio follows the silent switch and can be left
// 'suspended' or 'interrupted' (e.g. after speech) or 'closed' (page restored from the back/forward cache).
// Ask for the playback audio session, wake the audio on every tap, and only play once it is running.
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
var unlocked=false;
function ac(){try{if(!AC||AC.state==='closed')AC=new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state!=='running'){var p=AC.resume();if(p&&p.catch)p.catch(function(){})}
  if(!unlocked){var s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(AC.destination);s.start(0);unlocked=true}}catch(e){AC=null}return AC}
function whenAudio(fn){var c=ac();if(!c)return;if(c.state==='running'){fn();return}
  var done=false,go=function(){if(!done&&c.state==='running'){done=true;fn()}};
  try{c.resume().then(go,function(){})}catch(e){}setTimeout(go,300)}
document.addEventListener('pointerdown',function(){ac()},true);
document.addEventListener('touchend',function(){ac()},true);
window.addEventListener('pageshow',function(e){if(e.persisted){AC=null;unlocked=false}});
function noiseBuf(c,sec){var b=c.createBuffer(1,Math.floor(c.sampleRate*sec),c.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function cheer(){var c=ac();if(!c)return;var t=c.currentTime+0.05,out=c.createGain();out.gain.value=0.9;out.connect(c.destination);
  [523.25,659.25,783.99,1046.5].forEach(function(f,i){var o=c.createOscillator(),g=c.createGain(),st=t+i*0.12,len=i===3?0.6:0.16;
    o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.28,st+0.02);g.gain.exponentialRampToValueAtTime(0.001,st+len);
    o.connect(g);g.connect(out);o.start(st);o.stop(st+len+0.05)});
  var crowd=c.createBufferSource();crowd.buffer=noiseBuf(c,2.2);
  var bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1100;bp.Q.value=0.7;
  var cg=c.createGain();cg.gain.setValueAtTime(0,t);cg.gain.linearRampToValueAtTime(0.22,t+0.35);cg.gain.setValueAtTime(0.22,t+1.3);cg.gain.linearRampToValueAtTime(0,t+2.1);
  crowd.connect(bp);bp.connect(cg);cg.connect(out);crowd.start(t);crowd.stop(t+2.2);
  var clapBuf=noiseBuf(c,0.08);
  for(var k=0;k<22;k++){var ct=t+0.1+Math.random()*1.6,cs=c.createBufferSource(),hp=c.createBiquadFilter(),g2=c.createGain();
    cs.buffer=clapBuf;hp.type='highpass';hp.frequency.value=900+Math.random()*800;
    g2.gain.setValueAtTime(0.35,ct);g2.gain.exponentialRampToValueAtTime(0.001,ct+0.07);
    cs.connect(hp);hp.connect(g2);g2.connect(out);cs.start(ct);cs.stop(ct+0.08)}
}
function buzz(){var c=ac();if(!c)return;var t=c.currentTime+0.03,lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;lp.connect(c.destination);
  [[311,0,0.25],[262,0.28,0.5]].forEach(function(p,i){var o=c.createOscillator(),g=c.createGain(),st=t+p[1],len=p[2];
    o.type='sawtooth';o.frequency.setValueAtTime(p[0],st);if(i)o.frequency.linearRampToValueAtTime(p[0]*0.85,st+len);
    g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.18,st+0.02);g.gain.setValueAtTime(0.18,st+len-0.08);g.gain.linearRampToValueAtTime(0,st+len);
    o.connect(g);g.connect(lp);o.start(st);o.stop(st+len+0.05)})}
var fx=document.getElementById('fx'),fctx=fx.getContext('2d'),parts=[],flashes=[],running=false,
  COLS=['#FF5A5F','#FFC145','#3DDC97','#4CC9F0','#B388FF','#FF8FD8','#FF9F43','#FFFFFF'];
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function sizeFx(){var r=window.devicePixelRatio||1;fx.width=innerWidth*r;fx.height=innerHeight*r;fctx.setTransform(r,0,0,r,0,0)}
function boom(){var c=AC;if(!c)return;try{var t=c.currentTime,src=c.createBufferSource(),lp=c.createBiquadFilter(),g=c.createGain();
  src.buffer=noiseBuf(c,0.6);lp.type='lowpass';lp.frequency.value=500;g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.55);
  src.connect(lp);lp.connect(g);g.connect(c.destination);src.start(t);src.stop(t+0.6)}catch(e){}}
function spark(x,y,vx,vy,col,o){parts.push({x:x,y:y,px:x,py:y,vx:vx,vy:vy,c:col,life:0,max:o.max||70,r:o.r||2.2,drag:o.drag||0.975,grav:o.grav||0.05,tw:o.tw||false,crackle:o.crackle||false,kind:o.kind||'spark'})}
function explode(p){boom();flashes.push({x:p.x,y:p.y,life:0});
  var type=p.type,c1=p.c,c2=pick(COLS),i,a,v;
  if(type==='ring'){for(i=0;i<56;i++){a=i/56*Math.PI*2;v=4.2;spark(p.x,p.y,Math.cos(a)*v,Math.sin(a)*v,i%2?c1:c2,{max:70})}
    for(i=0;i<28;i++){a=i/28*Math.PI*2;v=2.2;spark(p.x,p.y,Math.cos(a)*v,Math.sin(a)*v,'#FFFFFF',{max:55,r:1.8})}}
  else if(type==='willow'){for(i=0;i<90;i++){a=Math.random()*Math.PI*2;v=1+Math.random()*3.6;spark(p.x,p.y,Math.cos(a)*v,Math.sin(a)*v,'#FFC145',{max:90,drag:0.98,grav:0.04,r:1.8,tw:true})}}
  else if(type==='heart'){for(i=0;i<70;i++){var tt=i/70*Math.PI*2,hx=16*Math.pow(Math.sin(tt),3),hy=-(13*Math.cos(tt)-5*Math.cos(2*tt)-2*Math.cos(3*tt)-Math.cos(4*tt));
    spark(p.x,p.y,hx*0.26,hy*0.26,'#FF5A9E',{max:65,drag:0.97,grav:0.025,r:2.4})}}
  else if(type==='crackle'){for(i=0;i<50;i++){a=Math.random()*Math.PI*2;v=2+Math.random()*3.5;spark(p.x,p.y,Math.cos(a)*v,Math.sin(a)*v,c1,{max:45+Math.random()*20,crackle:true})}}
  else{for(i=0;i<100;i++){a=Math.random()*Math.PI*2;v=1.5+Math.random()*4.8;spark(p.x,p.y,Math.cos(a)*v,Math.sin(a)*v,i%3?c1:c2,{max:50+Math.random()*25,tw:i%4===0})}}}
function rocket(type){var w=innerWidth,h=innerHeight,x=w*(0.15+Math.random()*0.7),ty=h*(0.12+Math.random()*0.3);
  var vy=-Math.sqrt(2*0.25*(h-ty))*0.98;parts.push({kind:'rocket',x:x,y:h+10,px:x,py:h+10,vx:(Math.random()-0.5)*1.2,vy:vy,c:pick(COLS),type:type,life:0,max:999});loop()}
var fwTimers=[];
function fwLater(fn,ms){var id=setTimeout(function(){fwTimers=fwTimers.filter(function(x){return x!==id});fn()},ms);fwTimers.push(id)}
function afterFx(cb){var t0=Date.now();(function chk(){var on=parts.length||flashes.length||fwTimers.length,el=Date.now()-t0;
  if((!on&&el>1500)||el>6000)cb();else setTimeout(chk,150)})()}
function clearFx(){fwTimers.forEach(clearTimeout);fwTimers=[];parts.length=0;flashes.length=0;fctx.clearRect(0,0,innerWidth,innerHeight)}
document.addEventListener('pointerdown',function(e){if(e.target&&e.target.closest&&e.target.closest('button,a'))clearFx()},true);
function loop(){if(!running){running=true;requestAnimationFrame(tick)}}
function fireworks(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  sizeFx();var seq=['sphere','ring','heart','willow','crackle','sphere','ring'];
  seq.forEach(function(t,i){fwLater(function(){rocket(t)},i*250)});
}
function tick(){fctx.clearRect(0,0,innerWidth,innerHeight);fctx.lineCap='round';
  for(var f=flashes.length-1;f>=0;f--){var fl=flashes[f];fl.life++;if(fl.life>10){flashes.splice(f,1);continue}
    fctx.globalAlpha=(1-fl.life/10)*0.5;fctx.fillStyle='#FFF6D6';fctx.beginPath();fctx.arc(fl.x,fl.y,18+fl.life*5,0,Math.PI*2);fctx.fill()}
  var add=[];
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.px=p.x;p.py=p.y;p.life++;
    if(p.kind==='rocket'){p.vy+=0.25;p.x+=p.vx;p.y+=p.vy;
      if(Math.random()<0.7)add.push([p.x,p.y,(Math.random()-0.5)*0.6,Math.random()*0.8,'#FFE3A3',{max:18,r:1.4,grav:0.02}]);
      if(p.vy>=-0.6){parts.splice(i,1);explode(p);continue}
      fctx.globalAlpha=1;fctx.strokeStyle=p.c;fctx.lineWidth=3;fctx.beginPath();fctx.moveTo(p.px,p.py+6);fctx.lineTo(p.x,p.y);fctx.stroke();continue}
    p.vx*=p.drag;p.vy=p.vy*p.drag+p.grav;p.x+=p.vx;p.y+=p.vy;
    if(p.life>p.max){if(p.crackle)for(var k=0;k<4;k++){var a=Math.random()*Math.PI*2;add.push([p.x,p.y,Math.cos(a)*1.4,Math.sin(a)*1.4,'#FFFFFF',{max:14,r:1.3,grav:0.03}])}
      parts.splice(i,1);continue}
    var al=1-p.life/p.max;if(p.tw&&Math.random()<0.35)al*=0.2;
    fctx.globalAlpha=al;fctx.strokeStyle=p.c;fctx.lineWidth=p.r*1.6;fctx.beginPath();fctx.moveTo(p.px-p.vx*2,p.py-p.vy*2);fctx.lineTo(p.x,p.y);fctx.stroke()}
  add.forEach(function(a){spark(a[0],a[1],a[2],a[3],a[4],a[5])});
  fctx.globalAlpha=1;
  if(parts.length||flashes.length)requestAnimationFrame(tick);else{running=false;fctx.clearRect(0,0,innerWidth,innerHeight)}}

var VOICE=null,UTT=null;
function pickVoice(){try{var vs=(speechSynthesis.getVoices()||[]).filter(function(v){return /^en[-_]GB/i.test(v.lang)});
  // A voice chosen on the Options page (options/) wins, if it's still on this phone. With no choice, iPhone/iPad name no voice
  // (only lang en-GB): the phone then uses its own British voice, which sounds best there. Elsewhere pick a British voice by name.
  var want='';try{want=localStorage.getItem('voice')||''}catch(e){}var ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
  if(want==='phone'||(!want&&ios)){VOICE=null;return}var mine=vs.filter(function(v){return v.voiceURI===want})[0]||vs.filter(function(v){return v.name===want})[0];if(mine){VOICE=mine;return}
  // Enhanced/premium British voice first (the user prefers how they sound); the standard one only if none is installed.
  var rank=function(v){var nm=(v.name||'')+' '+(v.voiceURI||'');return (/premium|enhanced|neural|natural/i.test(nm)?0:2)+(/super-compact/i.test(nm)?1:0)+(/daniel|kate|serena|arthur|martha|stephanie|google uk/i.test(nm)?0:1)};
  vs.sort(function(a,b){return rank(a)-rank(b)});VOICE=vs[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
var spokeSince=false;   // speech has run since the sound engine was last (re)made
function say(t){spokeSince=true;try{var ss=window.speechSynthesis;if(!ss)return;
  if(!VOICE)pickVoice();
  var go=function(){try{UTT=new SpeechSynthesisUtterance(t);if(VOICE)UTT.voice=VOICE;UTT.lang='en-GB';UTT.rate=0.8;UTT.volume=1;UTT.onstart=function(){speechOn=true};ss.resume();ss.speak(UTT)}catch(e){}};
  if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,120)}else go()}catch(e){}}
function fb(t,k){var f=$('fb');f.textContent=t;f.className='fb'+(k?' '+k:'')}
var STAR='<path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/>',res=[];
function drawStars(){var h='';for(var i=0;i<res.length;i++)h+='<svg class="st'+(res[i]?' '+res[i]:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+STAR+'</svg>';$('stars').innerHTML=h;
  $('stars').setAttribute('aria-label',score+' stars')}
function mark(ok){res[n]=ok?'ok':'miss';drawStars();var el=$('stars').children[n];if(el)el.classList.add('pop')}

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
// Words: a picture (emoji built into the phone) and its word, in 6 levels by reading difficulty. He starts on level 1;

var LEVELS=[
  // 1: three-letter words
  'cat🐱 dog🐶 pig🐷 hen🐔 fox🦊 bat🦇 rat🐀 ram🐏 ant🐜 bus🚌 sun☀️ bed🛏️ '+
  'hat🎩 box📦 pen🖊️ map🗺️ web🕸️ nut🥜 leg🦵 van🚐 cup☕ bag🎒 cap🧢 bin🗑️ '+
  'log🪵 egg🥚 axe🪓 pin📌 gem💎 fan🪭 net🥅 hut🛖',
  // 2: blends
  'frog🐸 crab🦀 drum🥁 milk🥛 hand✋ nest🪹 tent⛺ lips👄 bell🔔 plug🔌 clip📎 flag🚩 '+
  'gift🎁 wand🪄 plant🪴 bulb💡 skunk🦨 tram🚋',
  // 3: sh ch th ck ng oo ee ar or ow
  'fish🐟 ship🚢 shell🐚 sheep🐑 shark🦈 shirt👕 shorts🩳 chips🍟 chick🐤 thumb👍 bath🛁 sloth🦥 '+
  'duck🦆 sock🧦 lock🔒 clock⏰ rock🪨 brick🧱 ring💍 wing🪽 moon🌙 book📖 foot🦶 tooth🦷 '+
  'broom🧹 spoon🥄 boot👢 hook🪝 wool🧶 bee🐝 tree🌳 star⭐ car🚗 arm💪 scarf🧣 corn🌽 '+
  'torch🔦 cow🐮 owl🦉 clown🤡 crown👑 squid🦑 ear👂',
  // 4: long vowels
  'cake🎂 kite🪁 bone🦴 nose👃 rose🌹 snake🐍 whale🐳 fire🔥 boat⛵ coat🧥 goat🐐 snail🐌 '+
  'train🚂 cheese🧀 horse🐴 mouse🐭 house🏠 cloud☁️ tie👔 pie🥧 ice🧊 dice🎲 flute🪈 wave🌊 '+
  'plane✈️ slide🛝 bike🚲 shoe👟 juice🧃 bread🍞 pear🍐 bear🐻 deer🦌 leaf🍁 seal🦭 soap🧼 '+
  'goose🪿 saw🪚 moose🫎 swan🦢 chair🪑 wheel🛞 sweet🍬 beach🏖️ tea🍵 key🔑 bow🎀 heart❤️ '+
  'eye👁️',
  // 5: two syllables
  'apple🍎 lemon🍋 melon🍈 carrot🥕 rocket🚀 rabbit🐰 robot🤖 pencil✏️ basket🧺 teddy🧸 panda🐼 tiger🐯 '+
  'zebra🦓 camel🐪 parrot🦜 hippo🦛 lolly🍭 monkey🐵 donkey🫏 otter🦦 badger🦡 beaver🦫 hamster🐹 lizard🦎 '+
  'spider🕷️ tulip🌷 cactus🌵 magnet🧲 ladder🪜 hammer🔨 candle🕯️ bucket🪣 mirror🪞 window🪟 glasses👓 guitar🎸 '+
  'piano🎹 trumpet🎺 violin🎻 balloon🎈 castle🏰 garlic🧄 onion🧅 pepper🫑 cookie🍪 waffle🧇 bagel🥯 pretzel🥨 '+
  'honey🍯 butter🧈 bacon🥓 mango🥭 olive🫒 kiwi🥝 orange🍊 popcorn🍿 cupcake🧁 pancakes🥞 chilli🌶️ sofa🛋️ '+
  'laptop💻 crayon🖍️ ruler📏 spanner🔧 sponge🧽 plaster🩹 puzzle🧩 wizard🧙 fairy🧚 baby👶 snowman⛄ rainbow🌈 '+
  'planet🪐 comet☄️ tractor🚜 scooter🛴 taxi🚕 lorry🚚 canoe🛶 anchor⚓ feather🪶 penguin🐧 eagle🦅 dragon🐉 '+
  'dolphin🐬 lobster🦞 mushroom🍄 ghost👻 lion🦁 jeans👖 gloves🧤 dress👗 toilet🚽 shower🚿 sandwich🥪 turkey🦃',
  // 6: longer words
  'elephant🐘 giraffe🦒 kangaroo🦘 crocodile🐊 dinosaur🦕 butterfly🦋 ladybird🐞 hedgehog🦔 squirrel🐿️ flamingo🦩 peacock🦚 jellyfish🪼 '+
  'gorilla🦍 koala🐨 llama🦙 rhino🦏 unicorn🦄 octopus🐙 umbrella☂️ helicopter🚁 ambulance🚑 skateboard🛹 parachute🪂 toothbrush🪥 '+
  'screwdriver🪛 battery🔋 telescope🔭 microscope🔬 envelope✉️ calendar📅 trophy🏆 medal🏅 scissors✂️ camera📷 volcano🌋 mountain⛰️ '+
  'island🏝️ snowflake❄️ sunflower🌻 tomato🍅 potato🥔 banana🍌 strawberry🍓 watermelon🍉 pineapple🍍 coconut🥥 avocado🥑 broccoli🥦 '+
  'cucumber🥒 doughnut🍩 chocolate🍫 alien👽 fountain⛲ mermaid🧜‍♀️'];
var WORDS=[];LEVELS.forEach(function(t,lv){t.split(' ').forEach(function(s){var m=/^([a-z]+)(.+)$/.exec(s);if(m)WORDS.push({w:m[1],pic:m[2],k:m[1],lv:lv})})});
var EXTRA=('cot cut hot hit pot pet ten tin man mat sat dig big run fun jug mud rug pan jam dip zip top mop dot lid six fix tap nap lap sad dad pad wig fig job '
  +'dish wish shop luck back well tell sing took wall fall call lake make take soon free three stop from born silk dock').split(' ');
// Words that could name the same picture: never offered together (e.g. no 'cap' for the top hat).
var SAME=[['hat','cap'],['ship','boat','canoe'],['bed','cot'],['house','hut','tent'],['cup','mug','pot','tea'],['mouse','rat','hamster'],['boot','shoe'],
  ['car','van','taxi'],['plane','jet'],['foot','leg'],['rock','stone','brick'],['log','stick'],['bag','sack'],['bath','tub'],['goat','kid'],['baby','kid'],['dog','pup'],
  ['bin','can'],['hen','chick'],['fish','shark'],['sun','star'],['moon','planet'],['cloud','fog'],['bread','bun','bagel'],['cake','cupcake','bun'],['sweet','lolly'],
  ['cookie','biscuit'],['bear','teddy','panda','koala'],['moose','deer'],['monkey','gorilla'],['horse','pony','donkey'],['dinosaur','dragon'],['crocodile','lizard'],
  ['clock','watch'],['ring','gem'],['ice','cube'],['dice','cube'],['shirt','top'],['coat','jacket'],['fire','hot'],['bulb','torch'],['melon','watermelon'],
  ['pepper','chilli'],['octopus','squid'],['crab','lobster'],['tram','train'],['ambulance','van'],['sofa','chair'],['island','beach'],['mountain','volcano'],['tooth','teeth'],
  ['lips','mouth'],['hand','fist'],['bike','scooter'],['lorry','van'],['ice','snowflake'],
  ['tie','shirt'],['goose','duck','swan'],['otter','beaver'],['badger','skunk'],['rhino','hippo'],['jellyfish','octopus','squid'],['sandwich','bread'],
  ['pancakes','waffle'],['bagel','doughnut'],['comet','star'],['helicopter','plane'],['skateboard','scooter']];
function same(a,b){return SAME.some(function(g){return g.indexOf(a)>=0&&g.indexOf(b)>=0})}
var CHOICES=4,TRIES=2;
var MKEY='rd-misses',MISS={};try{MISS=JSON.parse(localStorage.getItem(MKEY)||'{}')||{}}catch(e){MISS={}}
function saveMiss(){try{localStorage.setItem(MKEY,JSON.stringify(MISS))}catch(e){}}
function noteMiss(k){MISS[k]=Math.min((MISS[k]||0)+1,5);saveMiss()}
function noteHit(k){if(MISS[k]){MISS[k]--;if(!MISS[k])delete MISS[k];saveMiss()}}
// Level: each word scores 1 (right first time), 0.5 (after a mistake) or 0 (missed). 7+ over the last 8 opens the next level;
// 1.5 or less over the last 5 goes back one. The history resets on each move; a new level starts from the next round.
var UP_WINDOW=8,UP_SCORE=7,DOWN_WINDOW=5,DOWN_SCORE=1.5;
var LKEY='rd-level',LV={lv:0,h:[]};
try{var sv=JSON.parse(localStorage.getItem(LKEY)||'null');if(sv&&typeof sv.lv==='number')LV={lv:Math.max(0,Math.min(sv.lv,LEVELS.length-1)),h:Array.isArray(sv.h)?sv.h:[]}}catch(e){}
function saveLv(){try{localStorage.setItem(LKEY,JSON.stringify(LV))}catch(e){}}
var moved=0;   // +1 / -1 if the level changed during this round
function record(score){LV.h.push(score);if(LV.h.length>UP_WINDOW)LV.h.shift();
  var sum=function(k){return LV.h.slice(-k).reduce(function(a,b){return a+b},0)};
  if(LV.h.length>=UP_WINDOW&&sum(UP_WINDOW)>=UP_SCORE&&LV.lv<LEVELS.length-1){LV.lv++;LV.h=[];moved=1}
  else if(LV.h.length>=DOWN_WINDOW&&sum(DOWN_WINDOW)<=DOWN_SCORE&&LV.lv>0){LV.lv--;LV.h=[];moved=-1}
  saveLv()}
// Pick the round from the open levels without repeats: the newest level's words 3 times as often, and words missed
// on the first try more often (weight + 2 x misses).
function pickRound(k){var pool=WORDS.filter(function(v){return v.lv<=LV.lv}),out=[];
  while(out.length<k&&pool.length){var tot=0,ws=pool.map(function(v){var x=(v.lv===LV.lv&&LV.lv>0?3:1)+2*(MISS[v.k]||0);tot+=x;return x}),r=Math.random()*tot,i=0;
  while(i<pool.length-1&&r>=ws[i]){r-=ws[i];i++}out.push(pool.splice(i,1)[0])}return out}
// Four words: the right one, one with the same first letter, one that rhymes (same last two letters), and one more of a similar
// length, from words up to one level above this one and EXTRA. The right word's place is shuffled.
function options(x){var w=x.w,all={},seen={},out=[];WORDS.forEach(function(v){if(v.lv<=x.lv+1)all[v.w]=1});EXTRA.forEach(function(v){all[v]=1});
  delete all[w];seen[w]=1;Object.keys(all).forEach(function(c){if(same(w,c))delete all[c]});
  var cand=shuf(Object.keys(all)),add=function(f){for(var i=0;i<cand.length&&out.length<CHOICES-1;i++){var c=cand[i];if(!seen[c]&&f(c)){seen[c]=1;out.push(c);return}}};
  add(function(c){return c[0]===w[0]});add(function(c){return c.slice(-2)===w.slice(-2)});
  add(function(c){return Math.abs(c.length-w.length)<=1});while(out.length<CHOICES-1)add(function(){return true});
  return shuf([w].concat(out))}
var ROUND=5,order=pickRound(ROUND),n=0,score=0,tries=0,busy=false;
// Safari only speaks once speech has been started inside a tap; later words said from timers are dropped until then.
// So the first tap (other than the speaker button, which speaks itself) starts a silent word.
var speechOn=false;
function unlockSpeech(e){if(speechOn)return;speechOn=true;var t=e&&e.target,b=t&&t.closest&&t.closest('button');if(b&&b.id==='hear')return;
  try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;u.lang='en-GB';speechSynthesis.speak(u)}catch(x){}}
document.addEventListener('touchend',unlockSpeech,true);document.addEventListener('click',unlockSpeech,true);
$('hear').onclick=function(){if(!lock('hear'))return;begin();ac();var h=$('hear');h.classList.remove('tap');void h.offsetWidth;h.classList.add('tap');say(order[n].w)};
// The start tap turns on sound and speech (inside the tap), then says the word. The speaker button does the same.
function begin(){var g=$('go');if(g.hidden)return false;g.hidden=true;wait(false);speechOn=true;ac();return true}
// Until ▶ is tapped: fade and disable every button but home (and the answers in Reading).
function wait(on){document.body.classList.toggle('waiting',on);['hear'].forEach(function(id){var b=$(id);if(b)b.disabled=on});
  var o=$('opts');if(o)Array.prototype.forEach.call(o.children,function(b){if(!b.classList.contains('no')&&!busy)b.disabled=on})}
if(!$('go').hidden)wait(true);
$('go').onclick=function(){if(!begin())return;say(order[n].w)};
// Each question shows all four words in one case, picked at random: lower (cat), capitals (CAT) or a capital first letter (Cat),
// so he learns to read all three and the case never gives the answer away.
var CASES=['lower','upper','title'],CASE='lower';
function cased(w){return CASE==='upper'?w.toUpperCase():CASE==='title'?w.charAt(0).toUpperCase()+w.slice(1):w}
// Long words (in capitals especially) shrink to fit their button.
function fitOpts(){Array.prototype.forEach.call($('opts').children,function(b){b.style.fontSize='';var fs=parseFloat(getComputedStyle(b).fontSize);
  while(b.scrollWidth>b.clientWidth&&fs>18){fs-=2;b.style.fontSize=fs+'px'}})}
window.addEventListener('resize',fitOpts);
function show(){var x=order[n];tries=0;busy=false;CASE=CASES[Math.floor(Math.random()*CASES.length)];
  $('prog').textContent='Word '+(n+1)+' of '+order.length;$('bar').style.width=(n/order.length*100)+'%';
  $('q').textContent=x.pic;fb('');
  var box=$('opts');box.innerHTML='';
  options(x).forEach(function(v){var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=cased(v);b.dataset.w=v;b.setAttribute('aria-label',v);
    if(!$('go').hidden)b.disabled=true;b.onclick=function(){answer(b,v)};box.appendChild(b)});fitOpts();
  if($('go').hidden)setTimeout(function(){if(order[n]===x&&!busy)say(x.w)},300)}
function reveal(x){Array.prototype.forEach.call($('opts').children,function(b){if(b.dataset.w===x.w)b.classList.add('ok');b.disabled=true})}
// iPhone: speech started without a tap (each new word) leaves Web Audio silent even though it says it's running, and only
// a tap can bring it back. So on each answer tap: stop any speech, remake the sound engine inside the tap if speech has
// run since, then play. The fireworks and moving on never wait for sound.
function freshAudio(){try{speechSynthesis.cancel()}catch(e){}
  if(spokeSince||!AC||AC.state!=='running'){try{if(AC&&AC.close)AC.close()}catch(e){}AC=null;unlocked=false;spokeSince=false}ac()}
function answer(b,v){if(busy||b.disabled||!$('go').hidden)return;freshAudio();var x=order[n];
  if(v===x.w)return right(b);
  b.classList.add('no','shake');b.disabled=true;wrong()}
function right(b){if(busy)return;busy=true;var x=order[n];score++;mark(true);if(tries===0)noteHit(x.k);record(tries===0?1:0.5);reveal(x);
  var c=['Well done!','Brilliant!','Super!','Great job!','Perfect!'];fb(c[Math.floor(Math.random()*c.length)],'ok');
  whenAudio(cheer);fireworks();afterFx(function(){n++;n<order.length?show():end()})}
// One mistake is allowed: the 2nd wrong tap shows the right word in green, says it, gives a grey star and moves on.
function wrong(){if(busy)return;var x=order[n];tries++;if(tries===1)noteMiss(x.k);whenAudio(buzz);
  if(tries>=TRIES){busy=true;mark(false);record(0);reveal(x);fb(cased(x.w),'info');
    setTimeout(function(){say('It says '+x.w)},850);setTimeout(function(){n++;n<order.length?show():end()},3800);return}
  fb('Please try again','no');setTimeout(function(){say('Please try again')},850)}
function lock(id){var b=$(id);if(!b||b.disabled)return false;b.disabled=true;setTimeout(function(){b.disabled=false},id==='hear'?3000:500);return true}
function end(){$('bar').style.width='100%';$('prog').textContent='All done';
  var L=order.length,st=score,s='';for(var i=0;i<L;i++)s+=res[i]==='ok'?'<span>★</span>':'<span class="off">★</span>';
  var ec=$('endcard');ec.innerHTML='<div class="end-stars">'+s+'</div><h2>'+score+' of '+order.length+' words!</h2><p class="ex">'+(st===L?'FIVE stars! You are winning!':'Good try. Play again for more stars.')+'</p><p class="lvl">Level '+(LV.lv+1)+' of '+LEVELS.length+' · '+WORDS.filter(function(v){return v.lv<=LV.lv}).length+' words</p><button id="again" type="button" class="again" aria-label="Play again"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11A8 8 0 1 0 18 17"/><path d="M20 5v6h-6"/></svg></button>';
  $('card').hidden=true;$('ctrl').hidden=true;ec.hidden=false;
  $('again').onclick=function(){if(!lock('again'))return;restart()};
  say((st===L?'Five stars! You are winning!':'All done! Well done!')+(moved>0?' New words next time!':''))}
function restart(){try{speechSynthesis.cancel()}catch(e){}moved=0;
  order=pickRound(ROUND);n=0;score=0;res=[];tries=0;busy=false;drawStars();
  $('endcard').hidden=true;$('endcard').innerHTML='';$('card').hidden=false;$('ctrl').hidden=false;show()}
window.addEventListener('pagehide',function(){try{speechSynthesis.cancel()}catch(e){}try{if(AC)AC.close()}catch(e){}});
drawStars();show();
</script>
<script>
// No pinch or double-tap zoom (Safari ignores user-scalable=no, so block its gesture events too).
['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()},{passive:false})});

document.addEventListener('dblclick',function(e){e.preventDefault()},{passive:false});
document.addEventListener('selectstart',function(e){e.preventDefault()});
