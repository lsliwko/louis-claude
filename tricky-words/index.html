<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tricky Words</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600&display=swap">
<style>
/* One centred play card on a soft playground ground; word is the hero */
:root{
  --ground:#EEF4FB; --card:#FFFFFF; --ink:#1C2647; --soft:#5A6485; --line:#D5DEEC;
  --accent:#2F5BEA; --accent-bg:#E3EAFE; --good:#1F7A4D; --good-bg:#DFF3E8; --bad:#B4322A; --bad-bg:#FBE3E0; --star:#E3A21A;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#10162A; --card:#1A2240; --ink:#EEF2FF; --soft:#A9B2D3; --line:#2E3963;
  --accent:#8EA8FF; --accent-bg:#26326A; --good:#7FD8A8; --good-bg:#173D2B; --bad:#FF9C92; --bad-bg:#4A1F1C; --star:#F4C04E; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#10162A; --card:#1A2240; --ink:#EEF2FF; --soft:#A9B2D3; --line:#2E3963;
  --accent:#8EA8FF; --accent-bg:#26326A; --good:#7FD8A8; --good-bg:#173D2B; --bad:#FF9C92; --bad-bg:#4A1F1C; --star:#F4C04E; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--soft);font-variant-numeric:tabular-nums}
.home{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);background:var(--card);border:2px solid var(--line)}
.home:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stars{display:flex;gap:3px}
.st{display:block;width:28px;height:28px}
.st path{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}
.st.ok path{fill:var(--star);stroke:var(--star)}
.st.miss path{fill:var(--soft);stroke:var(--soft)}
.st.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.5)}}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.word{font-family:var(--display);font-weight:700;font-size:clamp(72px,24vw,112px);line-height:1;color:var(--accent);margin:4px 0 0}
.ex{color:var(--soft);font-size:18px;margin:0}
button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 18px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:active{transform:scale(.97)}
.hear{width:72px;height:72px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);background:var(--accent-bg);border-color:var(--accent)}
.hear.tap{animation:pulse .5s 2}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.mic{width:100%;min-height:96px;font-family:var(--display);font-weight:700;font-size:22px;background:var(--accent);color:var(--card);border-color:var(--accent);display:flex;align-items:center;justify-content:center;gap:10px}
.mic{position:relative;overflow:hidden}
.mbar{position:absolute;left:0;bottom:0;height:10px;width:0;background:var(--card);opacity:.85;border-radius:0 5px 5px 0}
.hear:disabled,.mic:disabled{opacity:.75;cursor:default}
.mic.prep{background:var(--star);border-color:var(--star);animation:pulse .8s infinite}
.mic.live{background:var(--bad);border-color:var(--bad)}
@keyframes pulse{50%{transform:scale(1.03)}}
.fb{min-height:32px;text-align:center;font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}.fb.info{color:var(--soft);font-family:var(--body);font-weight:600;font-size:16px}
.label{text-align:center;font-size:14px;color:var(--soft);margin:0}
.marks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.marks button{min-height:60px;font-weight:600;font-size:17px}
.yes{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.no{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.end-stars{font-size:48px;color:var(--star);letter-spacing:4px;line-height:1}
.end-stars span.off{color:var(--soft)}
.end h2{font-family:var(--display);font-size:30px;margin:0;text-wrap:balance}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top"><a class="home" href="../" aria-label="Back to all games"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a><span id="prog" style="flex:1;margin-left:12px">Word 1 of 5</span><span class="stars" id="stars" aria-label="Stars"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="card" id="card">
    <p class="word" id="word">he</p>
    <button class="hear" id="hear" type="button" aria-label="Hear the word"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
  </div>
  <div class="card end" id="endcard" hidden></div>
  <div id="ctrl" style="display:flex;flex-direction:column;gap:12px">
    <button class="mic" id="mic" type="button" aria-label="Tap and say the word"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="micl" class="sr">Tap and say the word</span><span class="mbar" id="mbar" aria-hidden="true"></span></button>
    <p class="fb" id="fb" aria-live="polite"></p>
  </div>
</div>
<script>
var W=[
{w:"I",sp:"eye",s:["i","eye","aye","ay","ai","hi","high","oi","ah"]},
{w:"be",s:["be","bee","b","bea","bey","beat","bean","pea","pee","p"]},
{w:"me",s:["me","mi","mee","mea","meet","meat","knee","nee"]},
{w:"we",s:["we","wee","wii","whee","oui","weed","wed","week","wheat"]},
{w:"to",s:["to","too","two","2","tu","toe","do","doo","tooth"]},
{w:"he",s:["he","hee","hey","heat","hes","hed","e","ee","eat"]},
{w:"she",s:["she","shee","shi","sea","see","c","chi","chee","shea","sheep","sheet","sheesh"]},
{w:"was",s:["was","woz","wuz","what","whats","horse","hoss","wars","war","worse","wasp","wash","wuss","oz","does","boss","laws"]}
];
function $(id){return document.getElementById(id)}
var AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
function noiseBuf(c,sec){var b=c.createBuffer(1,Math.floor(c.sampleRate*sec),c.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function cheer(){var c=ac();if(!c)return;var t=c.currentTime+0.05,out=c.createGain();out.gain.value=0.9;out.connect(c.destination);
  [523.25,659.25,783.99,1046.5].forEach(function(f,i){var o=c.createOscillator(),g=c.createGain(),st=t+i*0.12,len=i===3?0.6:0.16;
    o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.28,st+0.02);g.gain.exponentialRampToValueAtTime(0.001,st+len);
    o.connect(g);g.connect(out);o.start(st);o.stop(st+len+0.05)});
  var crowd=c.createBufferSource();crowd.buffer=noiseBuf(c,2.2);
  var bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1100;bp.Q.value=0.7;
  var cg=c.createGain();cg.gain.setValueAtTime(0,t);cg.gain.linearRampToValueAtTime(0.22,t+0.35);cg.gain.setValueAtTime(0.22,t+1.3);cg.gain.linearRampToValueAtTime(0,t+2.1);
  crowd.connect(bp);bp.connect(cg);cg.connect(out);crowd.start(t);crowd.stop(t+2.2);
  var clapBuf=noiseBuf(c,0.08);
  for(var k=0;k<22;k++){var ct=t+0.1+Math.random()*1.6,cs=c.createBufferSource(),hp=c.createBiquadFilter(),g2=c.createGain();
    cs.buffer=clapBuf;hp.type='highpass';hp.frequency.value=900+Math.random()*800;
    g2.gain.setValueAtTime(0.35,ct);g2.gain.exponentialRampToValueAtTime(0.001,ct+0.07);
    cs.connect(hp);hp.connect(g2);g2.connect(out);cs.start(ct);cs.stop(ct+0.08)}
}
function buzz(){var c=ac();if(!c)return;var t=c.currentTime+0.03,lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;lp.connect(c.destination);
  [[311,0,0.25],[262,0.28,0.5]].forEach(function(p,i){var o=c.createOscillator(),g=c.createGain(),st=t+p[1],len=p[2];
    o.type='sawtooth';o.frequency.setValueAtTime(p[0],st);if(i)o.frequency.linearRampToValueAtTime(p[0]*0.85,st+len);
    g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(0.18,st+0.02);g.gain.setValueAtTime(0.18,st+len-0.08);g.gain.linearRampToValueAtTime(0,st+len);
    o.connect(g);g.connect(lp);o.start(st);o.stop(st+len+0.05)})}
var fx=document.getElementById('fx'),fctx=fx.getContext('2d'),parts=[],flashes=[],running=false,
  COLS=['#FF5A5F','#FFC145','#3DDC97','#4CC9F0','#B388FF','#FF8FD8','#FF9F43','#FFFFFF'];
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function sizeFx(){var r=window.devicePixelRatio||1;fx.width=innerWidth*r;fx.height=innerHeight*r;fctx.setTransform(r,0,0,r,0,0)}
function boom(){var c=AC;if(!c)return;try{var t=c.currentTime,src=c.createBufferSource(),lp=c.createBiquadFilter(),g=c.createGain();
  src.buffer=noiseBuf(c,0.6);lp.type='lowpass';lp.frequency.value=500;g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.55);
  src.connect(lp);lp.connect(g);g.connect(c.destination);src.start(t);src.stop(t+0.6)}catch(e){}}
function spark(x,y,vx,vy,col,o){parts.push({x:x,y:y,px:x,py:y,vx:vx,vy:vy,c:col,life:0,max:o.max||70,r:o.r||2.2,drag:o.drag||0.975,grav:o.grav||0.05,tw:o.tw||false,crackle:o.crackle||false,kind:o.kind||'spark'})}
function explode(p){boom();flashes.push({x:p.x,y:p.y,life:0});
  var type=p.type,c1=p.c,c2=pick(COLS),i,a,v;
  if(type==='ring'){for(i=0;i<56;i++){a=i/56*Math.PI*2;v=4.2;spark(p.x,p.y,Math.cos(a)*v,Math.sin(a)*v,i%2?c1:c2,{max:70})}
    for(i=0;i<28;i++){a=i/28*Math.PI*2;v=2.2;spark(p.x,p.y,Math.cos(a)*v,Math.sin(a)*v,'#FFFFFF',{max:55,r:1.8})}}
  else if(type==='willow'){for(i=0;i<90;i++){a=Math.random()*Math.PI*2;v=1+Math.random()*3.6;spark(p.x,p.y,Math.cos(a)*v,Math.sin(a)*v,'#FFC145',{max:120,drag:0.985,grav:0.035,r:1.8,tw:true})}}
  else if(type==='heart'){for(i=0;i<70;i++){var tt=i/70*Math.PI*2,hx=16*Math.pow(Math.sin(tt),3),hy=-(13*Math.cos(tt)-5*Math.cos(2*tt)-2*Math.cos(3*tt)-Math.cos(4*tt));
    spark(p.x,p.y,hx*0.26,hy*0.26,'#FF5A9E',{max:75,drag:0.97,grav:0.025,r:2.4})}}
  else if(type==='crackle'){for(i=0;i<50;i++){a=Math.random()*Math.PI*2;v=2+Math.random()*3.5;spark(p.x,p.y,Math.cos(a)*v,Math.sin(a)*v,c1,{max:45+Math.random()*20,crackle:true})}}
  else{for(i=0;i<100;i++){a=Math.random()*Math.PI*2;v=1.5+Math.random()*4.8;spark(p.x,p.y,Math.cos(a)*v,Math.sin(a)*v,i%3?c1:c2,{max:60+Math.random()*35,tw:i%4===0})}}}
function rocket(type){var w=innerWidth,h=innerHeight,x=w*(0.15+Math.random()*0.7),ty=h*(0.12+Math.random()*0.3);
  var vy=-Math.sqrt(2*0.12*(h-ty))*0.98;parts.push({kind:'rocket',x:x,y:h+10,px:x,py:h+10,vx:(Math.random()-0.5)*1.2,vy:vy,c:pick(COLS),type:type,life:0,max:999});loop()}
function loop(){if(!running){running=true;requestAnimationFrame(tick)}}
function fireworks(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  sizeFx();var seq=['sphere','ring','willow','heart','crackle','sphere','ring','willow'];
  seq.forEach(function(t,i){setTimeout(function(){rocket(t)},i*330)});
  setTimeout(function(){rocket('sphere');rocket('ring')},2800);
}
function tick(){fctx.clearRect(0,0,innerWidth,innerHeight);fctx.lineCap='round';
  for(var f=flashes.length-1;f>=0;f--){var fl=flashes[f];fl.life++;if(fl.life>10){flashes.splice(f,1);continue}
    fctx.globalAlpha=(1-fl.life/10)*0.5;fctx.fillStyle='#FFF6D6';fctx.beginPath();fctx.arc(fl.x,fl.y,18+fl.life*5,0,Math.PI*2);fctx.fill()}
  var add=[];
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.px=p.x;p.py=p.y;p.life++;
    if(p.kind==='rocket'){p.vy+=0.12;p.x+=p.vx;p.y+=p.vy;
      if(Math.random()<0.7)add.push([p.x,p.y,(Math.random()-0.5)*0.6,Math.random()*0.8,'#FFE3A3',{max:18,r:1.4,grav:0.02}]);
      if(p.vy>=-0.6){parts.splice(i,1);explode(p);continue}
      fctx.globalAlpha=1;fctx.strokeStyle=p.c;fctx.lineWidth=3;fctx.beginPath();fctx.moveTo(p.px,p.py+6);fctx.lineTo(p.x,p.y);fctx.stroke();continue}
    p.vx*=p.drag;p.vy=p.vy*p.drag+p.grav;p.x+=p.vx;p.y+=p.vy;
    if(p.life>p.max){if(p.crackle)for(var k=0;k<4;k++){var a=Math.random()*Math.PI*2;add.push([p.x,p.y,Math.cos(a)*1.4,Math.sin(a)*1.4,'#FFFFFF',{max:14,r:1.3,grav:0.03}])}
      parts.splice(i,1);continue}
    var al=1-p.life/p.max;if(p.tw&&Math.random()<0.35)al*=0.2;
    fctx.globalAlpha=al;fctx.strokeStyle=p.c;fctx.lineWidth=p.r*1.6;fctx.beginPath();fctx.moveTo(p.px-p.vx*2,p.py-p.vy*2);fctx.lineTo(p.x,p.y);fctx.stroke()}
  add.forEach(function(a){spark(a[0],a[1],a[2],a[3],a[4],a[5])});
  fctx.globalAlpha=1;
  if(parts.length||flashes.length)requestAnimationFrame(tick);else{running=false;fctx.clearRect(0,0,innerWidth,innerHeight)}}

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var ROUND=5,order=shuf(W).slice(0,ROUND),n=0,score=0,tries=0,busy=false,rec=null,SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var VOICE=null,UTT=null;
function pickVoice(){try{var vs=speechSynthesis.getVoices()||[];VOICE=vs.filter(function(v){return /^en[-_]GB/i.test(v.lang)})[0]||vs.filter(function(v){return /^en/i.test(v.lang)})[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){try{var ss=window.speechSynthesis;if(!ss)return;
  var go=function(){try{UTT=new SpeechSynthesisUtterance(t);if(VOICE)UTT.voice=VOICE;UTT.lang=VOICE?VOICE.lang:'en-GB';UTT.rate=0.8;UTT.volume=1;ss.resume();ss.speak(UTT)}catch(e){}};
  if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,120)}else go()}catch(e){}}
function fb(t,k){var f=$('fb');f.textContent=t;f.className='fb'+(k?' '+k:'')}
var STAR='<path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/>',res=[];
function drawStars(){var h='';for(var i=0;i<res.length;i++)h+='<svg class="st'+(res[i]?' '+res[i]:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+STAR+'</svg>';$('stars').innerHTML=h;
  $('stars').setAttribute('aria-label',score+' stars')}
function mark(ok){res[n]=ok?'ok':'miss';drawStars();var el=$('stars').children[n];if(el)el.classList.add('pop')}
function show(){var x=order[n];tries=0;busy=false;
  $('prog').textContent='Word '+(n+1)+' of '+order.length;$('bar').style.width=(n/order.length*100)+'%';
  $('word').textContent=x.w;fb('')}
function right(){if(busy)return;busy=true;score++;mark(true);
  var c=['Well done!','Brilliant!','Super!','Great job!','Perfect!'];fb(c[Math.floor(Math.random()*c.length)],'ok');
  try{speechSynthesis.cancel()}catch(e){}cheer();fireworks();setTimeout(function(){n++;n<order.length?show():end()},4300)}
function wrong(m){if(busy)return;tries++;buzz();
  if(tries>=4){busy=true;mark(false);fb("Let's try the next one",'info');setTimeout(function(){say("Let's try the next one")},850);
    setTimeout(function(){n++;n<order.length?show():end()},3000);return}
  fb(m||'Please try again','no');setTimeout(function(){say('Please try again')},850)}
function lock(id){var b=$(id);if(!b||b.disabled)return false;b.disabled=true;setTimeout(function(){b.disabled=false},500);return true}
$('hear').onclick=function(){if(!lock('hear'))return;var h=$('hear');h.classList.remove('tap');void h.offsetWidth;h.classList.add('tap');say(order[n].sp||order[n].w)};

function norm(t){return t.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim()}
var LISTEN=4500,listenTimer=null;
function stopUI(){clearTimeout(listenTimer);var m=$('mic'),b=$('mbar');m.classList.remove('live','prep');$('micl').textContent='Tap and say the word';
  b.style.transition='none';b.style.width='0%'}
function readyUI(){var m=$('mic');m.classList.remove('live');m.classList.add('prep');$('micl').textContent='Getting ready…'}
function startUI(){var m=$('mic'),b=$('mbar');m.classList.remove('prep');m.classList.add('live');$('micl').textContent='Listening…';
  b.style.transition='none';b.style.width='100%';void b.offsetWidth;b.style.transition='width '+LISTEN+'ms linear';b.style.width='0%'}
var NOMIC="The microphone isn't available in this browser.";
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
var TARGETS=W.map(function(v){return v.w.toLowerCase()});
function close(x,w){var tw=x.w.toLowerCase();if(x.s.indexOf(w)>=0)return true;
  if(tw.length>=3&&w!==tw&&TARGETS.indexOf(w)<0&&lev(w,tw)<=1)return true;return false}
function matches(x,t){if(close(x,t))return true;var ws=t.split(/\s+/);return ws.length<=2&&ws.some(function(w){return close(x,w)})}
var micState='idle',prevEnd=Promise.resolve(),noAudioEvt=false,cancelCur=null;
function nothingHeard(){fb("I didn't hear anything. Try again!",'info');setTimeout(function(){say("I didn't hear you. Please try again")},200)}
$('mic').onclick=function(){
  if(!lock('mic'))return;ac();if(busy)return;
  if(!SR){fb(NOMIC,'info');return}

  listen(0)

function listen(attempt){
  micState='prep';readyUI();fb('');
  try{speechSynthesis.cancel()}catch(e){}
  var x=order[n];
  prevEnd.then(function(){setTimeout(function(){if(micState!=='prep'||busy){if(!busy){micState='idle';stopUI()}return}run(x,attempt)},attempt?400:300)})
}
function run(x,attempt){
  var me;try{me=new SR();me.lang='en-GB';me.maxAlternatives=5;me.interimResults=true;me.continuous=false}catch(e){micState='idle';stopUI();fb(NOMIC,'info');return}
  rec=me;var decided=false,live=false,lastHeard='',watch=null,resolveEnd,ended=false;
  prevEnd=new Promise(function(r){resolveEnd=function(){if(!ended){ended=true;r()}}});
  function finishEnd(){setTimeout(resolveEnd,900)}
  function goLive(){if(live||decided)return;live=true;clearTimeout(watch);micState='live';startUI();
    listenTimer=setTimeout(function(){try{me.stop()}catch(e){}setTimeout(function(){decide(false)},700)},LISTEN)}
  function close_(){decided=true;clearTimeout(watch);clearTimeout(listenTimer);if(rec===me)rec=null;cancelCur=null;finishEnd()}
  function decide(ok){if(decided)return;close_();try{me.abort()}catch(e){}micState='idle';stopUI();
    ok?right():(lastHeard?wrong('I heard "'+lastHeard+'". Please try again'):nothingHeard())}
  function retry(){if(decided)return;close_();try{me.abort()}catch(e){}listen(attempt+1)}
  cancelCur=function(){if(decided)return;close_();try{me.abort()}catch(e){}micState='idle';stopUI()};
  me.onaudiostart=goLive;me.onsoundstart=goLive;me.onspeechstart=goLive;
  me.onresult=function(ev){if(!live){noAudioEvt=true;goLive()}
    for(var r=ev.resultIndex;r<ev.results.length;r++){var res=ev.results[r];
      for(var i=0;i<res.length;i++){var t=norm(res[i].transcript);if(!t)continue;if(i===0)lastHeard=t;if(matches(x,t)){decide(true);return}}
      if(res.isFinal){decide(false);return}}};
  me.onerror=function(ev){if(decided||ev.error==='aborted')return;
    if(!live&&attempt<1&&ev.error!=='not-allowed'&&ev.error!=='service-not-allowed'){retry();return}
    close_();micState='idle';stopUI();
    if(ev.error==='not-allowed'||ev.error==='service-not-allowed')fb("The microphone is blocked. Allow it in the browser settings.",'info');
    else if(ev.error==='no-speech')nothingHeard();
    else fb("Couldn't listen just now. Tap the microphone again.",'info')};
  me.onend=function(){resolveEnd();if(rec===me)rec=null;if(decided)return;
    if(!live&&attempt<1){decided=true;clearTimeout(watch);cancelCur=null;listen(attempt+1);return}
    decide(false)};
  watch=setTimeout(function(){if(live||decided)return;if(noAudioEvt||attempt>=1){goLive();return}retry()},1500);
  try{me.start()}catch(e){if(attempt<1){close_();resolveEnd();listen(attempt+1)}else{close_();micState='idle';stopUI();fb("Couldn't listen just now. Tap the microphone again.",'info')}}
}
function end(){$('bar').style.width='100%';$('prog').textContent='All done';
  var L=order.length,st=score,s='';for(var i=0;i<L;i++)s+=res[i]==='ok'?'<span>★</span>':'<span class="off">★</span>';
  var ec=$('endcard');ec.innerHTML='<div class="end-stars">'+s+'</div><h2>'+score+' of '+order.length+' words!</h2><p class="ex">'+(st===L?'Amazing talking.':'Good try. Play again for more stars.')+'</p><button id="again" type="button" class="mic" style="margin-top:8px" aria-label="Play again"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11A8 8 0 1 0 18 17"/><path d="M20 5v6h-6"/></svg></button>';
  $('card').hidden=true;$('ctrl').hidden=true;ec.hidden=false;
  $('again').onclick=function(){if(!lock('again'))return;restart()};
  say('All done! Well done!')}
function restart(){try{if(cancelCur)cancelCur()}catch(e){}try{speechSynthesis.cancel()}catch(e){}
  order=shuf(W).slice(0,ROUND);n=0;score=0;res=[];tries=0;busy=false;drawStars();
  $('endcard').hidden=true;$('endcard').innerHTML='';$('card').hidden=false;$('ctrl').hidden=false;show()}
window.addEventListener('pagehide',function(){try{if(cancelCur)cancelCur()}catch(e){}try{if(rec)rec.abort()}catch(e){}
  try{speechSynthesis.cancel()}catch(e){}try{if(AC)AC.close()}catch(e){}});
function preAskMic(){try{if(!SR||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return;
  try{if(sessionStorage.getItem('micAsked'))return;sessionStorage.setItem('micAsked','1')}catch(e){}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){st.getTracks().forEach(function(t){t.stop()})}).catch(function(){})}catch(e){}}
drawStars();show();preAskMic();
</script>
